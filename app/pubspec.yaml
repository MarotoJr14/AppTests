name: blue_sailing
description: Blue Sailing Tests - Exámenes para Patrón de Recreo
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.1
  firebase_auth: ^4.17.9
  cloud_firestore: ^4.15.9

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0

  # Utils
  uuid: ^4.3.3
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.10.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/blue_sailing_logo_fondo.png

# Launcher icon configuration (use `flutter pub run flutter_launcher_icons:main`)
flutter_icons:
  android: true
  ios: true
  image_path: assets/blue_sailing_logo_fondo.png
